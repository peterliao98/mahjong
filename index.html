<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="十六張麻將">
<meta name="theme-color" content="#123d29">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>台灣十六張麻將</title>
<style>
:root{
  --felt:#1f6141; --felt2:#123d29; --text:#eef6f0; --muted:#a9cdb8; --gold:#f2c14e;
  /* 自己的手牌：17 張＋摸牌間隔剛好排滿打牌區寬度（牌桌最寬 1180px），高度不超過畫面的 9% */
  --hw: clamp(22px, calc((min(100vw, 1180px) - 74px) / 17.5), min(80px, 9vh));
  --sw: clamp(15px, 2.5vw, 27px);
  --mw: max(22px, calc(var(--hw) * .72));   /* 自己的花牌與吃碰槓的牌 */
  --xw: clamp(12px, 1.9vw, 20px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--felt2)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--text);background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2));
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  /* 觸控：不要雙擊放大、點擊閃色、長按選字選單 */
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card code,.card textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,select{font:inherit}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;background:rgba(0,0,0,.25)}
.brand{font-weight:800;font-size:18px;letter-spacing:1px}
.meta{color:var(--muted);font-size:14px;flex:1;min-width:160px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.ctrls label{display:flex;gap:4px;align-items:center;cursor:pointer}
.btn,.ctrls button,.ctrls select{background:#f6efdc;color:#2b2b2b;border:0;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:600}
@media (hover:hover){.ctrls button:hover,.btn:hover{filter:brightness(1.07)}}
.ctrls .upd{background:var(--gold);color:#222}

#table{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"s2 s2 s2" "s3 c s1" "me me me";
  gap:8px;padding:8px;max-width:1180px;margin:0 auto}
.seat{background:rgba(0,0,0,.14);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:5px;border:2px solid transparent;min-width:0}
.seat.active,.me.active{border-color:var(--gold);box-shadow:0 0 14px rgba(242,193,78,.35)}
.s2{grid-area:s2;align-items:center}
/* 對家：每一排先留好最多張數的寬度、牌從左邊排起，摸牌打牌時其他牌不會移動 */
.s2 > *{width:min(100%, calc((var(--xw) + 3px) * 21))}
.s2 .row{justify-content:flex-start}
.s1{grid-area:s1;width:calc(var(--xw)*4 + 25px)}
.s3{grid-area:s3;width:calc(var(--xw)*4 + 25px)}
/* 左右兩家：一排 4 張，手牌那排先留 5 排（17 張）的高度 */
.s1 .row.hrow,.s3 .row.hrow{min-height:calc(var(--xw)*1.36*5 + 12px);align-content:flex-start}
/* 左右兩家的名字區固定兩行：第一行風位＋名字，第二行莊家＋分數 */
.s1 .head,.s3 .head{height:3em;align-content:flex-start;overflow:hidden;line-height:1.4}
.s1 .head b,.s3 .head b{width:calc(100% - 2.4em);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:13px}
.head b{font-size:14px}
.wind{background:#f6efdc;color:#7a2a1d;border-radius:5px;padding:0 5px;font-weight:800}
.dealer{background:#c0392b;color:#fff;border-radius:5px;padding:0 5px;font-weight:700;font-size:12px}
.score{color:var(--gold);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end}
.meld{display:flex;gap:1px;margin-right:4px}

#center{grid-area:c;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:". r2 ." "r3 mid r1" ". r0 .";
  gap:6px;align-items:center;justify-items:center;background:rgba(0,0,0,.13);border-radius:14px;padding:8px;min-height:240px}
.river{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-height:calc(var(--sw)*1.36)}
.rv0,.rv2{grid-area:r0;width:calc(var(--sw)*9 + 18px)} .rv2{grid-area:r2}
.rv1,.rv3{grid-area:r1;width:calc(var(--sw)*4 + 8px)} .rv3{grid-area:r3;justify-content:flex-end}
.mid{grid-area:mid;text-align:center;font-size:13px;color:var(--muted);padding:6px 4px;line-height:1.55;min-width:120px}
.mid .big{font-size:20px;color:var(--text);font-weight:800}
.mid code{font-size:11px;color:#d6e9dc}

.me{grid-area:me;background:rgba(0,0,0,.18);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px}
.actions .msg{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.act{border:0;border-radius:9px;padding:7px 14px;font-weight:800;cursor:pointer;font-size:15px;display:inline-flex;gap:3px;align-items:center;background:#f6efdc;color:#222}
.act.win{background:#e74c3c;color:#fff}.act.pung{background:#f2c14e}.act.kong{background:#9b59b6;color:#fff}.act.chow{background:#5dade2}
.act.pass{background:#7f8c8d;color:#fff}
.act .tile{--tw:18px}
/* 自己的區域：放大分數、花牌、吃碰槓的牌與動作按鈕 */
.mehead{display:flex;align-items:center;gap:16px;min-height:calc(var(--mw)*1.36 + 6px)}
.me .head{flex:none;flex-direction:column;align-items:flex-start;gap:2px}
.me .head b{font-size:20px}
.me .wind{font-size:18px;padding:1px 8px}
.me .dealer{font-size:15px;padding:1px 6px}
.me .score{font-size:26px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.mel{flex:1;min-width:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;align-items:flex-end;padding:2px 0 4px}
.mel .meld{margin-right:8px}
.mel .sep{flex:none;width:10px}
.tile.md{--tw:var(--mw)}
.me .actions{gap:10px;min-height:56px}
.me .act{font-size:21px;padding:9px 22px;min-height:52px;border-radius:12px;gap:6px}
.me .act .tile{--tw:28px}
.actions .msg{font-size:18px;color:var(--text);font-weight:700}
.actions .msg .tile{--tw:34px}
.me .cd{font-size:20px}
.ting{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:16px;color:var(--muted);white-space:nowrap}
.ting .tile{--tw:26px}
.hand{display:flex;gap:2px;align-items:flex-end;flex-wrap:nowrap;padding-top:16px;min-height:calc(var(--hw)*1.36 + 18px);overflow-x:auto}
.hand .tile{cursor:default;transition:transform .12s}
.hand.can .tile{cursor:pointer}
@media (hover:hover){.hand.can .tile:hover{transform:translateY(-5px)}}
.hand .tile.sel{transform:translateY(-14px)!important;outline:3px solid var(--gold);outline-offset:1px}
.hand .tile.gap{margin-left:calc(var(--hw)*.45)}
/* 新的一局：手牌先蓋著，再從左到右一張張亮出來（牌背蓋在牌面上，時間到就拿掉） */
.hand .tile.deal::before{content:"";position:absolute;inset:0;background:inherit;background-position:75% 100%;border-radius:inherit;
  opacity:0;animation:dealback .02s step-end backwards;animation-delay:var(--dd)}
@keyframes dealback{from{opacity:1}to{opacity:0}}
.hand .tile.tp::after{content:"";position:absolute;top:-8px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold)}
.hint{font-size:13px;color:var(--muted);min-height:20px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.hint .tile{--tw:17px}

/* tiles */
/* 牌面來自一張 9×5 的拼圖（第 k 張在第 k%9 欄、第 k/9 列；42 是牌背） */

.tile.sm{--tw:var(--sw)} .tile.xs{--tw:var(--xw)}
.tile.back{background-position:75% 100%}
.tile.last{outline:3px solid var(--gold);outline-offset:1px}
.tile.taken{opacity:.35}
.tile.wintile{outline:3px solid #e74c3c;outline-offset:1px}
.tile.dim{filter:brightness(.88)}

#log{display:none;max-width:1180px;margin:0 auto 16px;padding:6px 16px;font-size:13px;color:var(--muted);max-height:120px;overflow:auto}
#log div{padding:1px 0}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.hidden{display:none}
.card{background:#fbf6e9;color:#222;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.card h2{margin:0 0 10px;font-size:22px}
.card h3{margin:16px 0 6px;font-size:16px}
.card p,.card li{font-size:14px;line-height:1.65}
.card table{border-collapse:collapse;width:100%;font-size:14px}
.card td,.card th{padding:4px 8px;border-bottom:1px solid #e2d8bf;text-align:left}
.card .num{text-align:right;font-variant-numeric:tabular-nums}
.card .pos{color:#1d7a3a;font-weight:700}.card .neg{color:#c0392b;font-weight:700}
.card .tile{--tw:26px}
.card .handrow{display:flex;flex-wrap:wrap;gap:2px;align-items:flex-end;margin:6px 0}
.card code,.card textarea{font-size:12px;word-break:break-all}
.card textarea{width:100%;height:70px}
.card .rhead{position:sticky;top:-18px;z-index:1;margin:-18px -20px 6px;padding:14px 20px 10px;background:#fbf6e9;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .rhead h2{margin:0}
.card .rhead .btn{flex:none}
.card .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.card .btn{background:#1f6141;color:#fff;padding:8px 18px;font-size:15px}
.card .btn.alt{background:#ddd2b6;color:#222}
.ok{color:#1d7a3a;font-weight:800}.bad{color:#c0392b;font-weight:800}
/* 大廳與等待室 */
.lobby{display:flex;flex-direction:column;gap:10px;margin:6px 0 4px}
.fld{font-size:14px;font-weight:700}
.card input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #d8cdb0;border-radius:8px;background:#fff;color:#222;width:100%;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.card input:focus-visible,.card .btn:focus-visible{outline:3px solid #f2c14e;outline-offset:2px}
.card .btn.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;font-size:17px}
.card .btn.big small{font-weight:400;font-size:13px;opacity:.85}
.card .btn:disabled{opacity:.5;cursor:default}
.joinrow{display:flex;gap:8px}.joinrow input{flex:1;min-width:0}
.lbmsg{min-height:22px;margin:0;color:#c0392b;font-size:14px}
.card .code{font-size:44px;font-weight:800;letter-spacing:8px;margin:0 0 6px;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.seatlist{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seatlist li{background:#efe6cf;border-radius:8px;padding:9px 12px;font-size:15px}
.muted{color:#7a7363}
.card details{margin-top:12px}.card summary{cursor:pointer;font-weight:700;font-size:15px}
.cd{color:var(--gold);font-weight:800;margin-left:6px;font-variant-numeric:tabular-nums}
/* 帳號與戰績 */
.acct{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#efe6cf;border-radius:10px;padding:8px 10px}
.acct .who{flex:1;min-width:0;font-size:15px}
.card .acct .btn{padding:7px 14px;font-size:14px}
.seg{display:flex;gap:0;margin:4px 0 6px;border-radius:9px;overflow:hidden;border:1px solid #d8cdb0}
.seg button{flex:1;border:0;padding:9px;font:inherit;font-size:15px;font-weight:700;background:#fff;color:#555;cursor:pointer}
.seg button.on{background:#1f6141;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0 4px}
.kpi{background:#efe6cf;border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:#6b6455}

/* 觸控螢幕：按鈕加大好點 */
@media (pointer:coarse){
  .ctrls{gap:8px}
  .ctrls button,.ctrls select{padding:9px 13px;min-height:40px}
  .ctrls label{min-height:40px}
  .ctrls input[type=checkbox]{width:20px;height:20px}
  .act{padding:10px 18px;min-height:44px}
  .card .btn{padding:11px 22px}
  .hand{-webkit-overflow-scrolling:touch}
}

/* 平板與電腦：整個遊戲剛好一個畫面，每一區固定大小，牌變多也不會推動別的區塊 */
@media (min-width:700px) and (min-height:600px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  .bar{flex:none}
  .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #table{flex:1;min-height:0;width:100%;grid-template-rows:auto minmax(0,1fr) auto}
  /* 對手：每一排先留好位置 */
  .seat .row{min-height:calc(var(--xw)*1.36)}
  .s2 .row{flex-wrap:nowrap}
  .s1,.s3{overflow-y:auto;overflow-x:hidden}
  /* 牌河：上下各留三排，左右兩家從上往下排，中間資訊不動 */
  #center{min-height:0;overflow:hidden;align-items:start;
    grid-template-areas:"r3 r2 r1" "r3 mid r1" "r3 r0 r1";
    grid-template-rows:calc((var(--sw)*1.36 + 2px)*3) minmax(0,1fr) calc((var(--sw)*1.36 + 2px)*3)}
  /* 牌河大小由程式依中間區域算好（--rw 牌寬、--rvt 上下兩家寬、--rvs 左右兩家寬） */
  .river .tile.sm{--tw:var(--rw,var(--sw))}
  .rv0,.rv2{width:var(--rvt,calc(var(--sw)*9 + 18px))}
  .rv1,.rv3{width:var(--rvs,calc(var(--sw)*4 + 8px))}
  .mid{align-self:center}
  /* 自己：每一排固定高度 */
  .mehead{height:calc(var(--mw)*1.36 + 10px)}
  .me .actions{height:60px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
  .hand{height:calc(var(--hw)*1.36 + 20px);min-height:0;overflow-y:hidden}
}

@media (max-width:640px){
  #table{gap:5px;padding:5px}
  .brand{font-size:16px}
  .act{padding:6px 10px;font-size:14px}
  .me .act{font-size:16px;padding:6px 12px;min-height:40px}
  .me .score{font-size:20px}
  .mid{min-width:0;font-size:11px;padding:4px 0}
  .mid .big{font-size:16px}
}

/* ===== 手機橫拿：一個畫面放下全部；按鈕列收進右上角「☰」選單 ===== */
.menubtn,#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  :root{
    --hw: clamp(20px, calc((100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px) - 60px) / 17.5), 12vh);
    --mw: calc(var(--hw) * .62);
    --xw: 13px; --sw: 18px;
  }
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  #table{flex:1;min-height:0;width:100%;max-width:none;padding:4px;gap:4px;grid-template-rows:auto minmax(0,1fr) auto}
  .seat{padding:3px 6px;gap:2px;border-radius:8px}
  .head{font-size:11px;gap:2px 4px}.head b{font-size:12px}
  .wind{padding:0 4px}.dealer{font-size:10px;padding:0 4px}
  /* 對家：一行放完 */
  /* 手機：名字｜花牌｜吃碰槓｜手牌，手牌固定在右邊、寬度留 17 張 */
  .s2{display:grid;grid-template-columns:8.5em calc((var(--xw) + 3px) * 8) minmax(0,1fr) calc(13px * 17);align-items:center;column-gap:8px;padding-right:52px}
  .s2 > *{width:auto}
  .s2 .row{flex-wrap:nowrap;overflow:hidden}
  .s2 .head{flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
  .s2 .head b{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .s2 .hrow .tile{--tw:10px}
  .s1,.s3{width:calc(var(--xw)*4 + 25px);overflow-y:auto;overflow-x:hidden}
  .seat .row{min-height:calc(var(--xw)*1.36)}
  #center{min-height:0;overflow:hidden;align-items:start;padding:4px;gap:4px;border-radius:10px;
    grid-template-areas:"r3 r2 r1" "r3 mid r1" "r3 r0 r1";
    grid-template-rows:calc((var(--sw)*1.36 + 2px)*2) minmax(0,1fr) calc((var(--sw)*1.36 + 2px)*2)}
  .river .tile.sm{--tw:var(--rw,var(--sw))}
  .rv0,.rv2{width:var(--rvt,calc(var(--sw)*12 + 24px))}
  .rv1,.rv3{width:var(--rvs,calc(var(--sw)*4 + 8px))}
  .mid{align-self:center;min-width:0;font-size:10px;line-height:1.3;padding:0}
  .mid .big{font-size:14px}
  /* 自己：上排＝分數、花牌、吃碰槓（左）＋動作按鈕（右）；下排＝手牌 */
  .me{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head acts" "hand hand";
    column-gap:8px;row-gap:0;padding:3px 8px 4px;border-radius:10px}
  .mehead{grid-area:head;height:max(42px, calc(var(--mw)*1.36 + 6px));min-height:0;gap:10px}
  .me .head{flex-direction:row;align-items:center;gap:6px}
  .me .head b{font-size:14px}.me .wind{font-size:14px}.me .dealer{font-size:12px}
  .me .score{font-size:18px}
  .me .actions{grid-area:acts;height:max(42px, calc(var(--mw)*1.36 + 6px));min-height:0;gap:6px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-width:62vw}
  .me .act{font-size:16px;padding:5px 12px;min-height:38px;border-radius:10px}
  .me .act .tile{--tw:20px}
  .actions .msg{font-size:14px}.actions .msg .tile{--tw:24px}
  .me .cd{font-size:15px}
  .ting{font-size:12px;gap:3px}.ting .tile{--tw:18px}
  .hand{grid-area:hand;height:calc(var(--hw)*1.36 + 12px);min-height:0;padding-top:10px;overflow-y:hidden}
  .hand .tile.sel{transform:translateY(-8px)!important}
  .hand .tile.tp::after{top:-6px}
  /* 右上角選單 */
  .bar{display:none}
  .menubtn{display:flex;align-items:center;justify-content:center;position:fixed;z-index:15;
    top:calc(env(safe-area-inset-top, 0px) + 6px);right:calc(env(safe-area-inset-right, 0px) + 8px);
    width:40px;height:34px;border:0;border-radius:9px;background:rgba(246,239,220,.92);color:#222;font-size:20px;font-weight:800;cursor:pointer}
  .menubtn.dot::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#e74c3c}
  body.menu-open .bar{display:flex;flex-direction:column;align-items:stretch;gap:10px;position:fixed;z-index:16;
    top:calc(env(safe-area-inset-top, 0px) + 46px);right:calc(env(safe-area-inset-right, 0px) + 8px);
    width:min(300px, 80vw);max-height:calc(100% - 56px);overflow:auto;padding:12px;border-radius:12px;background:#123d29;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  body.menu-open .brand{font-size:15px}
  body.menu-open .meta{white-space:normal;font-size:13px;min-width:0}
  body.menu-open .ctrls{flex-direction:column;align-items:stretch;gap:8px}
  body.menu-open .ctrls label{min-height:36px}
  .modal{padding:8px}
  .card{max-height:calc(100% - 8px);padding:12px 16px}
  .card .rhead{top:-12px;margin:-12px -16px 6px;padding:10px 16px 8px}
}
/* 手機直拿：請轉成橫向 */
@media (orientation:portrait) and (max-width:600px){
  #rotate{display:flex;position:fixed;inset:0;z-index:40;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:24px;background:var(--felt2);color:var(--text);text-align:center;font-size:18px;font-weight:700}
  #rotate .ph{width:54px;height:86px;border:4px solid var(--gold);border-radius:12px;animation:turn 2.4s ease-in-out infinite}
  #rotate small{font-size:14px;font-weight:400;color:var(--muted)}
}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(-90deg)}}
</style>

<body>
<header class="bar">
  <div class="brand">🀄 台灣十六張麻將</div>
  <div class="meta" id="meta"></div>
  <div class="ctrls">
    <label><input type="checkbox" id="optHint" checked> 聽牌提示</label>
    <label><input type="checkbox" id="optAuto"> 托管</label>
    <select id="optSpeed" title="電腦出牌速度">
      <option value="1.6">慢速</option><option value="1" selected>中速</option><option value="0.45">快速</option><option value="0.05">極速</option>
    </select>
    <button id="btnRules">規則</button>
    <button id="btnUpdate" class="upd" hidden>有新版本</button>
    <button id="btnNew">新遊戲</button>
  </div>
</header>
<button id="btnMenu" class="menubtn" aria-label="選單" aria-expanded="false">☰</button>
<div id="rotate" role="alert"><div class="ph"></div>請把手機轉成橫向<small>麻將要橫著拿才排得下整副手牌</small></div>

<main id="table">
  <section class="seat s2" id="seat2"></section>
  <section class="seat s3" id="seat3"></section>
  <section id="center">
    <div class="river rv2" id="river2"></div>
    <div class="river rv3" id="river3"></div>
    <div class="mid" id="mid"></div>
    <div class="river rv1" id="river1"></div>
    <div class="river rv0" id="river0"></div>
  </section>
  <section class="seat s1" id="seat1"></section>
  <section class="me" id="seat0"></section>
</main>
<div id="log"></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>

<script>
(() => {
'use strict';

/* ================= 牌的定義 =================
   0-8 萬、9-17 筒、18-26 條、27-30 東南西北、31-33 中發白、34-41 春夏秋冬梅蘭菊竹 */
const NUM = '一二三四五六七八九', SUITS = '萬筒條', HON = '東南西北中發白', FLW = '春夏秋冬梅蘭菊竹', WINDS = '東南西北';
const BASE = 300, PER_TAI = 100, START = 20000, KEEP = 16;   // 底 300、每台 100、留 16 張不摸
const tName = t => t < 27 ? NUM[t % 9] + SUITS[(t / 9) | 0] : t < 34 ? HON[t - 27] : FLW[t - 34];
const isTerm = t => t < 27 && (t % 9 === 0 || t % 9 === 8);
const byNum = (a, b) => a - b;
function counts(arr) { const c = new Array(34).fill(0); for (const t of arr) if (t != null && t < 34) c[t]++; return c; }
function removeOne(arr, t) { const i = arr.indexOf(t); if (i < 0) throw new Error('missing tile ' + t); arr.splice(i, 1); }

/* ================= 公平亂數與雜湊 ================= */
// 用瀏覽器的密碼學亂數；拒絕取樣避免取模偏差
function randU32() { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }
function randInt(n) { const lim = Math.floor(0x100000000 / n) * n; let x; do { x = randU32(); } while (x >= lim); return x % n; }
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } }
function randHex(bytes) { const b = new Uint8Array(bytes); crypto.getRandomValues(b); return [...b].map(x => x.toString(16).padStart(2, '0')).join(''); }

// SHA-256（純 JS，離線 file:// 也能用）
function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const maxWord = 2 ** 32; const words = []; const bitLen = ascii.length * 8;
  let hash = [], k = [], primes = 0; const comp = {};
  for (let cand = 2; primes < 64; cand++) {
    if (!comp[cand]) {
      for (let i = 0; i < 313; i += cand) comp[i] = cand;
      if (primes < 8) hash[primes] = (Math.pow(cand, .5) * maxWord) | 0;
      k[primes++] = (Math.pow(cand, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80'; while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) { const j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
  words[words.length] = (bitLen / maxWord) | 0; words[words.length] = bitLen;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16); const old = hash; hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
      const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
        (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
  }
  let out = '';
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; out += (b < 16 ? '0' : '') + b.toString(16); }
  return out;
}

/* ================= 牌型分析（純函式，只吃傳進來的牌） ================= */
function setsOnly(c, i) {
  while (i < 34 && !c[i]) i++;
  if (i === 34) return true;
  if (c[i] >= 3) { c[i] -= 3; const ok = setsOnly(c, i); c[i] += 3; if (ok) return true; }
  if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
    c[i]--; c[i + 1]--; c[i + 2]--; const ok = setsOnly(c, i); c[i]++; c[i + 1]++; c[i + 2]++; if (ok) return true;
  }
  return false;
}
function canWinC(c) {
  let n = 0; for (const x of c) n += x; if (n % 3 !== 2) return false;
  for (let i = 0; i < 34; i++) if (c[i] >= 2) { c[i] -= 2; const ok = setsOnly(c, 0); c[i] += 2; if (ok) return true; }
  return false;
}
function canWin(hand, N) { return hand.length === 3 * N + 2 && canWinC(counts(hand)); }

function allDecomps(c) {
  const res = [];
  const rec = (i, sets, pair) => {
    while (i < 34 && !c[i]) i++;
    if (i === 34) { res.push({ pair, sets: sets.slice() }); return; }
    if (c[i] >= 3) { c[i] -= 3; sets.push({ k: 'pung', t: i }); rec(i, sets, pair); sets.pop(); c[i] += 3; }
    if (i < 27 && i % 9 <= 6 && c[i + 1] && c[i + 2]) {
      c[i]--; c[i + 1]--; c[i + 2]--; sets.push({ k: 'chow', t: i }); rec(i, sets, pair); sets.pop(); c[i]++; c[i + 1]++; c[i + 2]++;
    }
  };
  for (let i = 0; i < 34; i++) if (c[i] >= 2) { c[i] -= 2; rec(0, [], i); c[i] += 2; }
  return res;
}

// 向聽數：分花色計算 (面子, 搭子) 組合並快取
const segCache = new Map();
function segOpts(c, s, len, honor) {
  let key = honor ? 'h' : 's'; for (let k = 0; k < len; k++) key += c[s + k];
  let r = segCache.get(key); if (r) return r;
  const a = c.slice(s, s + len), seen = new Set();
  const rec = (i, m, t) => {
    while (i < len && !a[i]) i++;
    if (i === len) { seen.add(m * 16 + t); return; }
    if (a[i] >= 3) { a[i] -= 3; rec(i, m + 1, t); a[i] += 3; }
    if (!honor && i <= len - 3 && a[i + 1] && a[i + 2]) { a[i]--; a[i + 1]--; a[i + 2]--; rec(i, m + 1, t); a[i]++; a[i + 1]++; a[i + 2]++; }
    if (a[i] >= 2) { a[i] -= 2; rec(i, m, t + 1); a[i] += 2; }
    if (!honor && i <= len - 2 && a[i + 1]) { a[i]--; a[i + 1]--; rec(i, m, t + 1); a[i]++; a[i + 1]++; }
    if (!honor && i <= len - 3 && a[i + 2]) { a[i]--; a[i + 2]--; rec(i, m, t + 1); a[i]++; a[i + 2]++; }
    const save = a[i]; a[i] = 0; rec(i + 1, m, t); a[i] = save;
  };
  rec(0, 0, 0);
  let list = [...seen].map(x => [x >> 4, x & 15]);
  list = list.filter(([m, t]) => !list.some(([m2, t2]) => m2 >= m && t2 >= t && (m2 > m || t2 > t)));
  segCache.set(key, list); return list;
}
const SEGS = [[0, 9, false], [9, 9, false], [18, 9, false], [27, 7, true]];
function shantenPart(c, N, pair) {
  let states = [[0, 0]];
  for (const [s, len, h] of SEGS) {
    const opts = segOpts(c, s, len, h), next = new Map();
    for (const [m, t] of states) for (const [m2, t2] of opts) {
      const M = Math.min(m + m2, N), T = Math.min(t + t2, N); next.set(M * 16 + T, [M, T]);
    }
    states = [...next.values()];
  }
  let mx = 0; for (const [m, t] of states) { const v = 2 * m + Math.min(t, N - m); if (v > mx) mx = v; }
  return 2 * N - mx - pair;
}
function shantenC(c, N) {
  let best = shantenPart(c, N, 0);
  for (let i = 0; i < 34; i++) if (c[i] >= 2) { c[i] -= 2; const v = shantenPart(c, N, 1); c[i] += 2; if (v < best) best = v; }
  return best;
}
function minDiscardShanten(c, N) {
  let m = 99; for (let t = 0; t < 34; t++) if (c[t]) { c[t]--; const s = shantenC(c, N); c[t]++; if (s < m) m = s; } return m;
}
// 聽哪些牌；held 為自己手上+自己面子的張數（四張都在自己手上就不算聽）
function waitsOf(tiles, held) {
  const c = counts(tiles), res = [];
  for (let t = 0; t < 34; t++) { if (held && held[t] >= 4) continue; c[t]++; if (canWinC(c)) res.push(t); c[t]--; }
  return res;
}

/* ================= 電腦 AI =================
   AI 只會收到 viewFor() 產生的「視野」：自己的手牌 + 桌面公開資訊。
   看不到牌山、看不到其他人手牌、看不到別人暗槓的牌。 */
const AI = {
  unseen(v) {
    const u = new Array(34).fill(4);
    for (const t of v.hand) u[t]--;
    for (const ms of v.melds) for (const m of ms) for (const t of m.tiles) if (t != null) u[t]--;
    for (const ds of v.discards) for (const d of ds) if (!d.called) u[d.tile]--;
    return u.map(x => Math.max(0, x));
  },
  isYakuhai(t, v) { return t >= 31 || t === 27 + v.roundWind || t === 27 + v.seatWind; },
  near(c, x) {
    if (x >= 27) return c[x] > 0;
    const s = ((x / 9) | 0) * 9;
    for (let y = Math.max(s, x - 2); y <= Math.min(s + 8, x + 2); y++) if (c[y]) return true;
    return false;
  },
  chooseDiscard(v) {
    const N = 5 - v.melds[v.seat].length, c = counts(v.hand), un = AI.unseen(v);
    const cand = [...new Set(v.hand)].map(t => { c[t]--; const sh = shantenC(c, N); c[t]++; return { t, sh }; });
    const minSh = Math.min(...cand.map(x => x.sh));
    const threats = [0, 1, 2, 3].filter(p => p !== v.seat && (v.melds[p].length >= 3 || (v.wallLeft < 24 && v.melds[p].length >= 2)));
    const safety = t => {
      let s = 0;
      for (const p of threats) if (v.discards[p].some(d => d.tile === t)) s += 100;
      s += (4 - un[t] - counts(v.hand)[t]) * 6;
      if (t >= 27) s += 10; else if (isTerm(t)) s += 4;
      return s;
    };
    if (threats.length && minSh >= 2) { // 牌太差又有人快胡 → 防守
      cand.sort((a, b) => safety(b.t) - safety(a.t) || a.sh - b.sh);
      return cand[0].t;
    }
    const good = cand.filter(x => x.sh === minSh);
    for (const g of good) {
      c[g.t]--;
      let uk = 0;
      for (let x = 0; x < 34; x++) {
        if (!un[x] || !AI.near(c, x)) continue;
        c[x]++; if (shantenC(c, N) < minSh) uk += un[x]; c[x]--;
      }
      let shape = 0;
      if (g.t >= 27) shape += c[g.t] === 0 ? (AI.isYakuhai(g.t, v) ? 1 : 3) : 0;
      else if (isTerm(g.t)) shape += 1;
      c[g.t]++;
      g.score = uk * 10 + shape + (threats.length ? safety(g.t) * 0.3 : 0);
    }
    good.sort((a, b) => b.score - a.score);
    return good[0].t;
  },
  turn(v, opts) {
    if (opts.tsumo) return { type: 'tsumo' };
    const N = 5 - v.melds[v.seat].length, c = counts(v.hand);
    if (opts.kakan.length) return { type: 'kakan', tile: opts.kakan[0] };
    for (const t of opts.ankong) {
      const before = minDiscardShanten(c, N);
      c[t] -= 4; const after = shantenC(c, N - 1); c[t] += 4;
      if (after <= before) return { type: 'ankong', tile: t };
    }
    return { type: 'discard', tile: AI.chooseDiscard(v) };
  },
  claim(v, t, o) {
    if (o.win) return { type: 'win' };
    const N = 5 - v.melds[v.seat].length, c = counts(v.hand), before = shantenC(c, N);
    if (o.kong) { c[t] -= 3; const a = shantenC(c, N - 1); c[t] += 3; if (a <= before) return { type: 'kong' }; }
    if (o.pung) {
      c[t] -= 2; const a = minDiscardShanten(c, N - 1); c[t] += 2;
      if (a < before || (a === before && before > 0 && AI.isYakuhai(t, v))) return { type: 'pung' };
    }
    let best = null, bestA = before;
    for (const use of o.chow) {
      c[use[0]]--; c[use[1]]--; const a = minDiscardShanten(c, N - 1); c[use[0]]++; c[use[1]]++;
      if (a < bestA) { bestA = a; best = use; }
    }
    if (best) return { type: 'chow', use: best };
    return { type: 'pass' };
  }
};

/* ================= 遊戲狀態（封裝在閉包內） ================= */
const $ = id => document.getElementById(id);
const REL = ['你', '下家', '對家', '上家'];
const TURN_MS = 30000, NEXT_MS = 60000;            // 連線時：每次決定最多等 30 秒，下一局最多等 60 秒
const SOLO_SEATS = () => [{ type: 'local' }, { type: 'ai' }, { type: 'ai' }, { type: 'ai' }];
const G = {
  scores: [START, START, START, START], dealer: 0, streak: 0, moves: 0, round: 0, roundWind: 0,
  auto: false, hint: true, speed: 1, lastFair: null, logs: [],
  mode: 'solo',                 // solo：單人；host：連線的房主（連線的其他玩家不跑遊戲引擎）
  seats: SOLO_SEATS(),          // 每個座位：local（這台）、remote（連線玩家）、ai（電腦）
  seq: 0, result: null, over: null
};
let S = null, selIdx = -1, curActions = [];
const prompts = new Map();      // 座位 → 正在等的真人決定
const ABORT = { abort: true };
const isHuman = p => G.seats[p].type !== 'ai';
const seatWind = p => (p - G.dealer + 4) % 4;
const wallLeft = () => S.b - S.f - KEEP;
const nameOf = p => G.seats[p].name || REL[p];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function deepFreeze(o) { if (o && typeof o === 'object') { Object.freeze(o); for (const k of Object.keys(o)) deepFreeze(o[k]); } return o; }
// 給 AI 的視野：只有自己的手牌與公開資訊（連線玩家收到的也是這一份）
function viewFor(p) {
  return deepFreeze({
    seat: p,
    hand: S.players[p].hand.slice(),
    melds: S.players.map((P, i) => P.melds.map(m => ({
      type: m.type, tiles: (m.type === 'ankong' && i !== p) ? [null, null, null, null] : m.tiles.slice()
    }))),
    discards: S.players.map(P => P.discards.map(d => ({ tile: d.tile, called: d.called }))),
    flowers: S.players.map(P => P.flowers.slice()),
    wallLeft: wallLeft(), dealer: G.dealer, roundWind: G.roundWind, seatWind: seatWind(p)
  });
}

function addLog(s) { G.logs.unshift(s); if (G.logs.length > 80) G.logs.pop(); const el = $('log'); if (el) el.innerHTML = G.logs.map(x => `<div>${esc(x)}</div>`).join(''); }
async function sleep(ms) { const st = S; await new Promise(r => setTimeout(r, ms * G.speed)); if (st && st.dead) throw ABORT; }

function aiDecide(p, kind, data) {
  if (kind === 'next') return { type: 'next' };
  const v = viewFor(p);
  return kind === 'turn' ? AI.turn(v, data) : AI.claim(v, data.tile, data.opts);
}
// 連線玩家送來的動作要先檢查合不合法，不合法就交給電腦決定
function validAct(p, kind, data, a) {
  if (!a || typeof a !== 'object') return false;
  if (kind === 'next') return a.type === 'next';
  if (kind === 'turn') {
    if (a.type === 'tsumo') return !!data.tsumo;
    if (a.type === 'ankong') return data.ankong.includes(a.tile);
    if (a.type === 'kakan') return data.kakan.includes(a.tile);
    if (a.type === 'discard') return S.players[p].hand.includes(a.tile);
    return false;
  }
  const o = data.opts;
  if (a.type === 'pass') return true;
  if (a.type === 'win') return !!o.win;
  if (a.type === 'pung') return !!o.pung;
  if (a.type === 'kong') return !!o.kong;
  if (a.type === 'chow') return Array.isArray(a.use) && o.chow.some(u => u[0] === a.use[0] && u[1] === a.use[1]);
  return false;
}
// 等某位真人玩家做決定（這台的玩家、或連線玩家）。連線時超過時間由電腦代打一手
function waitHuman(p, kind, data) {
  const st = S;
  return new Promise((res, rej) => {
    const timeout = G.mode === 'host' ? (kind === 'next' ? NEXT_MS : TURN_MS) : 0;
    const pr = {
      p, kind, data, seq: ++G.seq, deadline: timeout ? NET.now() + timeout : 0, timers: [],
      res: v => {
        if (pr.done) return;
        pr.done = true; pr.timers.forEach(clearTimeout);
        if (prompts.get(p) === pr) prompts.delete(p);
        if (p === 0) selIdx = -1;
        if (st.dead || v == null) rej(ABORT); else res(v);
        render();
      },
      ai: () => pr.res(aiDecide(p, kind, data))
    };
    prompts.set(p, pr);
    if (timeout) pr.timers.push(setTimeout(pr.ai, timeout));
    if (p === 0 && G.auto && kind !== 'next') pr.timers.push(setTimeout(pr.ai, 300 * G.speed));
    if (G.seats[p].type === 'remote') NET.promptRemote(pr);
    render();
  });
}
function autoResolve() { const pr = prompts.get(0); if (pr && pr.kind !== 'next') pr.ai(); }

/* ---------- 摸牌（每一張都記錄位置，供局後驗證） ---------- */
function takeFront() { const i = S.f++; S.drawLog.push(['F', i, S.wall[i]]); return S.wall[i]; }
function takeBack() { const i = --S.b; S.drawLog.push(['B', i, S.wall[i]]); return S.wall[i]; }
function drawFor(p, fromBack) {
  const P = S.players[p];
  if (wallLeft() <= 0) return null;
  let t = fromBack ? takeBack() : takeFront();
  while (t >= 34) {
    P.flowers.push(t); addLog(`${nameOf(p)} 補花：${tName(t)}`);
    if (wallLeft() <= 0) return null;
    t = takeBack();
  }
  P.hand.push(t); P.hand.sort(byNum);
  return t;
}
function replaceFlowersAtDeal(p) {
  const P = S.players[p];
  while (P.hand.some(t => t >= 34)) {
    const fl = P.hand.filter(t => t >= 34); P.hand = P.hand.filter(t => t < 34);
    for (const f of fl) { P.flowers.push(f); P.hand.push(takeBack()); }
  }
  P.hand.sort(byNum);
}

/* ---------- 一局 ---------- */
async function playRound() {
  const wall = [];
  for (let t = 0; t < 34; t++) for (let k = 0; k < 4; k++) wall.push(t);
  for (let f = 34; f < 42; f++) wall.push(f);
  shuffle(wall);
  const salt = randHex(16);
  const commit = sha256(salt + '|' + wall.join(','));
  S = {
    wall, f: 0, b: wall.length, salt, commit, drawLog: [], dead: false, reveal: false, cur: G.dealer, last: null, drawn: null,
    players: [0, 1, 2, 3].map(() => ({ hand: [], melds: [], flowers: [], discards: [] }))
  };
  addLog(`── 第 ${G.round + 1} 局（${WINDS[G.roundWind]}風圈），莊家：${nameOf(G.dealer)}。牌山承諾 SHA-256：${commit.slice(0, 16)}…`);
  for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) {
    const p = (G.dealer + k) % 4; for (let j = 0; j < 4; j++) S.players[p].hand.push(takeFront());
  }
  S.players[G.dealer].hand.push(takeFront());
  for (let k = 0; k < 4; k++) replaceFlowersAtDeal((G.dealer + k) % 4);
  render(); await sleep(Math.max(500, DEAL_MS / G.speed));   // 等大家的手牌翻開（不受出牌速度影響）

  let cur = G.dealer, needDraw = false, canSelf = true, kongDraw = false;
  while (true) {
    S.cur = cur;
    if (needDraw) {
      const t = drawFor(cur, false);
      if (t === null) return { type: 'draw' };
      S.drawn = t; kongDraw = false; canSelf = true;
    }
    render();
    const P = S.players[cur], N = 5 - P.melds.length;
    const opts = { tsumo: canSelf && canWin(P.hand, N), ankong: [], kakan: [] };
    if (canSelf && wallLeft() > 0) {
      const c = counts(P.hand);
      for (let t = 0; t < 34; t++) if (c[t] === 4) opts.ankong.push(t);
      for (const m of P.melds) if (m.type === 'pung' && c[m.tiles[0]]) opts.kakan.push(m.tiles[0]);
    }
    const haidi = wallLeft() <= 0;
    let act;
    if (isHuman(cur)) act = await waitHuman(cur, 'turn', opts);
    else { await sleep(650); act = AI.turn(viewFor(cur), opts); }

    if (act.type === 'tsumo') {
      const wt = S.drawn != null ? S.drawn : P.hand[P.hand.length - 1];
      return settleWin(cur, null, wt, { selfDraw: true, kongDraw, haidi, tenhou: cur === G.dealer && S.drawLog.filter(d => d[0] === 'F').length === 65 && !S.players.some(x => x.melds.length || x.discards.length) });
    }
    if (act.type === 'ankong' || act.type === 'kakan') {
      const t = act.tile;
      if (act.type === 'ankong') { for (let i = 0; i < 4; i++) removeOne(P.hand, t); P.melds.push({ type: 'ankong', tiles: [t, t, t, t] }); addLog(`${nameOf(cur)} 暗槓`); }
      else { removeOne(P.hand, t); const m = P.melds.find(m => m.type === 'pung' && m.tiles[0] === t); m.type = 'kong'; m.tiles.push(t); addLog(`${nameOf(cur)} 加槓 ${tName(t)}`); }
      S.drawn = null; render(); await sleep(450);
      const d = drawFor(cur, true); if (d === null) return { type: 'draw' };
      S.drawn = d; kongDraw = true; canSelf = true; needDraw = false;
      continue;
    }
    // 打牌
    const t = act.tile;
    removeOne(P.hand, t);
    P.discards.push({ tile: t, called: false });
    S.last = { p: cur, i: P.discards.length - 1 }; S.drawn = null;
    addLog(`${nameOf(cur)} 打出 ${tName(t)}`);
    render(); await sleep(300);

    const claim = await resolveClaims(cur, t);
    if (claim) {
      if (claim.type === 'win') return settleWin(claim.p, cur, t, { selfDraw: false, haidi });
      const q = claim.p, Q = S.players[q];
      P.discards[S.last.i].called = true; S.last = null;
      if (claim.type === 'pung') { removeOne(Q.hand, t); removeOne(Q.hand, t); Q.melds.push({ type: 'pung', tiles: [t, t, t], from: cur }); addLog(`${nameOf(q)} 碰 ${tName(t)}`); }
      else if (claim.type === 'kong') { for (let i = 0; i < 3; i++) removeOne(Q.hand, t); Q.melds.push({ type: 'kong', tiles: [t, t, t, t], from: cur }); addLog(`${nameOf(q)} 明槓 ${tName(t)}`); }
      else { for (const x of claim.use) removeOne(Q.hand, x); Q.melds.push({ type: 'chow', tiles: [...claim.use, t].sort(byNum), from: cur }); addLog(`${nameOf(q)} 吃 ${tName(t)}`); }
      cur = q; S.cur = q; render(); await sleep(400);
      if (claim.type === 'kong') {
        const d = drawFor(q, true); if (d === null) return { type: 'draw' };
        S.drawn = d; kongDraw = true; canSelf = true;
      } else { canSelf = false; kongDraw = false; }
      needDraw = false;
      continue;
    }
    cur = (cur + 1) % 4; needDraw = true;
  }
}

// 打出的牌：胡 > 碰/槓 > 吃（截胡：按出牌順序最近者優先）。可以吃碰胡的真人玩家同時詢問
async function resolveClaims(from, t) {
  const info = [1, 2, 3].map(k => (from + k) % 4).map(p => {
    const P = S.players[p], N = 5 - P.melds.length, c = counts(P.hand);
    const o = { p, win: canWin([...P.hand, t], N), pung: c[t] >= 2, kong: c[t] >= 3 && wallLeft() > 0, chow: [] };
    if (p === (from + 1) % 4 && t < 27) {
      const n = t % 9;
      if (n >= 2 && c[t - 2] && c[t - 1]) o.chow.push([t - 2, t - 1]);
      if (n >= 1 && n <= 7 && c[t - 1] && c[t + 1]) o.chow.push([t - 1, t + 1]);
      if (n <= 6 && c[t + 1] && c[t + 2]) o.chow.push([t + 1, t + 2]);
    }
    return o;
  });
  const asks = info.filter(o => isHuman(o.p) && (o.win || o.pung || o.kong || o.chow.length));
  const hc = new Map();
  await Promise.all(asks.map(async o => { hc.set(o.p, await waitHuman(o.p, 'claim', { tile: t, from, opts: o })); }));
  const dec = (o, stage) => isHuman(o.p) ? hc.get(o.p) : AI.claim(viewFor(o.p), t,
    stage === 'win' ? o : stage === 'pung' ? { ...o, win: false, chow: [] } : { ...o, win: false, pung: false, kong: false });
  for (const o of info) {
    if (!o.win) continue;
    const d = dec(o, 'win'); if (d && d.type === 'win') return { type: 'win', p: o.p };
  }
  for (const o of info) {
    if (!o.pung && !o.kong) continue;
    const d = dec(o, 'pung'); if (d && (d.type === 'pung' || d.type === 'kong')) return { type: d.type, p: o.p };
  }
  for (const o of info) {
    if (!o.chow.length) continue;
    const d = dec(o, 'chow'); if (d && d.type === 'chow') return { type: 'chow', p: o.p, use: d.use };
  }
  return null;
}

/* ---------- 算台 ---------- */
function calcTai(p, concealed, winTile, selfDraw, from, flags) {
  const P = S.players[p], seatW = seatWind(p), roundW = G.roundWind;
  const decs = allDecomps(counts(concealed));
  const pre = concealed.slice(); removeOne(pre, winTile);
  const held = counts([...pre, ...P.melds.flatMap(m => m.tiles)]);
  const waitN = waitsOf(pre, held).length;
  const menqing = P.melds.every(m => m.type === 'ankong');
  const fl = P.flowers;
  let best = null;
  for (const d of decs) {
    const items = [];
    const sets = d.sets.map(s => ({ k: s.k, t: s.t, conc: true }));
    if (!selfDraw && d.pair !== winTile && !sets.some(s => s.k === 'chow' && winTile >= s.t && winTile <= s.t + 2)) {
      const ps = sets.find(s => s.k === 'pung' && s.t === winTile); if (ps) ps.conc = false;
    }
    for (const m of P.melds) sets.push({ k: m.type === 'chow' ? 'chow' : 'pung', t: m.tiles[0] != null ? Math.min(...m.tiles) : 0, conc: m.type === 'ankong' });
    if (flags.tenhou) items.push(['天胡', 24]);
    if (menqing && selfDraw) items.push(['門清自摸', 3]);
    else { if (menqing) items.push(['門清', 1]); if (selfDraw) items.push(['自摸', 1]); }
    if (fl.length === 8) items.push(['八仙過海', 8]);
    else {
      const g1 = [34, 35, 36, 37].every(f => fl.includes(f)), g2 = [38, 39, 40, 41].every(f => fl.includes(f));
      if (g1) items.push(['春夏秋冬', 2]); if (g2) items.push(['梅蘭竹菊', 2]);
      const own = fl.filter(f => (f - 34) % 4 === seatW && !((f < 38 && g1) || (f >= 38 && g2))).length;
      if (own) items.push(['正花', own]);
    }
    const pungs = sets.filter(s => s.k === 'pung');
    const dr = pungs.filter(s => s.t >= 31).length, drPair = d.pair >= 31;
    if (dr === 3) items.push(['大三元', 8]);
    else if (dr === 2 && drPair) items.push(['小三元', 4]);
    else for (const s of pungs) if (s.t >= 31) items.push([HON[s.t - 27] + '（三元牌）', 1]);
    const wd = pungs.filter(s => s.t >= 27 && s.t <= 30).length, wdPair = d.pair >= 27 && d.pair <= 30;
    if (wd === 4) items.push(['大四喜', 16]);
    else if (wd === 3 && wdPair) items.push(['小四喜', 8]);
    else {
      if (pungs.some(s => s.t === 27 + roundW)) items.push(['圈風 ' + WINDS[roundW], 1]);
      if (pungs.some(s => s.t === 27 + seatW)) items.push(['門風 ' + WINDS[seatW], 1]);
    }
    if (pungs.length === 5) items.push(['碰碰胡', 4]);
    const an = pungs.filter(s => s.conc).length;
    if (an >= 5) items.push(['五暗刻', 8]); else if (an === 4) items.push(['四暗刻', 5]); else if (an === 3) items.push(['三暗刻', 2]);
    const reps = [...sets.map(s => s.t), d.pair];
    const suits = new Set(reps.filter(t => t < 27).map(t => (t / 9) | 0)), hasHonor = reps.some(t => t >= 27);
    if (suits.size === 0) items.push(['字一色', 16]);
    else if (suits.size === 1) items.push(hasHonor ? ['混一色', 4] : ['清一色', 8]);
    if (sets.every(s => s.k === 'chow') && !hasHonor && fl.length === 0 && !selfDraw && waitN >= 2) items.push(['平胡', 2]);
    const quanqiu = P.melds.length === 5 && P.melds.every(m => m.type !== 'ankong') && !selfDraw;
    if (quanqiu) items.push(['全求人', 2]); else if (waitN === 1) items.push(['獨聽', 1]);
    if (flags.kongDraw && selfDraw) items.push(['槓上開花', 1]);
    if (flags.haidi && selfDraw) items.push(['海底撈月', 1]);
    if (flags.haidi && !selfDraw) items.push(['河底撈魚', 1]);
    const total = items.reduce((s, x) => s + x[1], 0);
    if (!best || total > best.total) best = { items, total };
  }
  const dealerItems = [['莊家', 1]]; if (G.streak) dealerItems.push([`連${G.streak}拉${G.streak}`, 2 * G.streak]);
  best.dealerItems = dealerItems; best.dealerTai = dealerItems.reduce((s, x) => s + x[1], 0);

}

function settleWin(p, from, tile, flags) {
  const P = S.players[p];
  if (from !== null) { S.players[from].discards[S.last.i].called = true; P.hand.push(tile); P.hand.sort(byNum); }
  const sc = calcTai(p, P.hand.slice(), tile, flags.selfDraw, from, flags);
  const pays = [0, 0, 0, 0];
  const payers = flags.selfDraw ? [0, 1, 2, 3].filter(x => x !== p) : [from];
  const detail = [];
  for (const q of payers) {
    const dealerRel = q === G.dealer || p === G.dealer;
    const tai = sc.total + (dealerRel ? sc.dealerTai : 0);
    const amt = BASE + PER_TAI * tai;
    pays[q] -= amt; pays[p] += amt; detail.push({ q, tai, amt });
  }
  for (let i = 0; i < 4; i++) G.scores[i] += pays[i];
  addLog(flags.selfDraw ? `${nameOf(p)} 自摸 ${tName(tile)}！` : `${nameOf(p)} 胡 ${nameOf(from)} 的 ${tName(tile)}！`);
  return { type: 'win', p, from, tile, sc, pays, detail, selfDraw: flags.selfDraw };
}

/* 牌河放到最大：在中間區域裡試各種「每排幾張、共幾排」，挑牌最大的排法。

async function showResult(res) {

  if (res.type === 'draw') addLog('流局（荒莊），莊家連莊。');
  G.result = resultData(res);
  recordRound(G.result, localSeat(), statMode(), gameKey(G.round));
  render();

function advance(res) {

async function showGameOver(reason) {
  const rank = [0, 1, 2, 3].sort((a, b) => G.scores[b] - G.scores[a]);

  recordMatch(G.over, localSeat(), statMode(), gameKey('over'), G.round);
  render();
  const v = await waitModal(gameOverHTML(G.over, buildDisplay(0)), [{ label: '回大廳', v: 'lobby', alt: true }, { label: '再來一將', v: 'again' }]);
  G.over = null;

async function gameLoop() {
  try {
    while (true) {
      const res = await playRound();
      await showResult(res);
      advance(res);
      if (G.scores.some(s => s <= 0)) { await showGameOver('有玩家分數歸零。'); return; }
      if (G.moves >= 16) { await showGameOver('東南西北四圈打完。'); return; }
    }
  } catch (e) { if (e !== ABORT) { console.error(e); addLog('發生錯誤：' + e.message); } }
}

/* ================= 連線（Firebase 即時資料庫） =================
   房主那台跑遊戲引擎，把「每個人看得到的畫面資料」寫到 rooms/房號/view/玩家，
   玩家的動作寫到 rooms/房號/act/玩家。資料庫規則讓每個人只能讀自己那一份。 */
const FB_VER = '10.12.2';
const NET = {
  role: null, code: null, uid: null, db: null, offset: 0, seat: 0, open: false, status: null,
  subs: [], lastSent: {}, online: {}, seatsVal: {}, lastFair: null, started: false, hostUid: null,
  hostAway: false, modalKind: null, shownNext: null, shownOver: null, autoSeq: null, syncT: 0, awayT: 0,
  now() { return Date.now() + this.offset; },
  ref(p) { return this.db.ref(`rooms/${this.code}/${p}`); },
  watch(path, fn) { const r = this.db.ref(path); const h = r.on('value', fn, err => console.warn(path, err)); this.subs.push([r, h]); },
  unwatchAll() { for (const [r, h] of this.subs) r.off('value', h); this.subs = []; },
  // 房主：把每位連線玩家的畫面資料寫出去（同一輪內的多次更新合併成一次）
  sync() {
    if (this.role !== 'host' || this.syncT) return;
    this.syncT = setTimeout(() => {
      this.syncT = 0;
      if (!S || this.role !== 'host') return;
      for (let p = 0; p < 4; p++) {
        const s = G.seats[p]; if (s.type !== 'remote') continue;
        const D = buildDisplay(p); D.lastFair = G.result ? G.lastFair : null;
        const j = JSON.stringify(D);
        if (j !== this.lastSent[p]) { this.lastSent[p] = j; this.ref(`view/${s.uid}`).set(j).catch(e => console.warn(e)); }
      }
    }, 30);
  },
  promptRemote(pr) { if (!this.online[G.seats[pr.p].uid]) pr.timers.push(setTimeout(pr.ai, 1500)); },
  send(seq, a) {
    this.ref(`act/${this.uid}`).set({ seq, a: JSON.stringify(a) }).catch(e => console.warn(e));
    if (lastD) { lastD = { ...lastD, prompt: null }; draw(lastD); }
  },
  leave() {
    if (this.db) this.unwatchAll();
    if (this.db && this.code) {
      if (this.role === 'host') { this.db.ref(`rooms/${this.code}`).remove(); this.db.ref(`lobby/${this.code}`).remove(); }
      else {
        this.ref(`online/${this.uid}`).remove();
        if (this.status !== 'playing') this.ref(`seats/${this.seat}`).remove();
      }
    }
    const wasOnline = !!this.role;
    clearTimeout(this.awayT);
    Object.assign(this, { role: null, code: null, open: false, status: null, lastSent: {}, online: {}, seatsVal: {}, lastFair: null,
      started: false, hostUid: null, hostAway: false, modalKind: null, shownNext: null, shownOver: null, autoSeq: null });
    saveRoom(null);
    if (wasOnline) { stopGame(); S = null; G.mode = 'solo'; G.seats = SOLO_SEATS(); clearTable(); }
    setMode();
  }
};

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('無法載入連線元件，請檢查網路')); document.head.appendChild(s); });
}
let fbReady = null;
function connect() {
  if (fbReady) return fbReady;
  fbReady = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    await loadScript(base + 'firebase-app-compat.js');
    await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-database-compat.js'),
      window.FIREBASE_CONFIG ? null : loadScript('firebase-config.js')]);
    if (!firebase.apps.length) firebase.initializeApp(window.FIREBASE_CONFIG);
    const auth = firebase.auth();
    auth.languageCode = 'zh-TW';            // 驗證信、重設密碼信用中文
    // 測試用：網址加 ?test=1 時每個分頁各自是一位玩家
    if (TEST) await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    let user = await new Promise(r => { const off = auth.onAuthStateChanged(u => { off(); r(u); }); });
    if (!user) user = (await auth.signInAnonymously()).user;
    NET.uid = user.uid;
    setAcct(user);
    NET.db = firebase.database();
    NET.db.ref('.info/serverTimeOffset').on('value', s => { NET.offset = s.val() || 0; });
    NET.db.ref('.info/connected').on('value', s => { if (s.val()) onReconnect(); });
    // 等真的連上伺服器再繼續，避免剛連線時讀到空資料
    await new Promise((res, rej) => { const t = setTimeout(() => rej(new Error('連不上伺服器，請確認網路後再試一次')), 15000); const r = NET.db.ref('.info/connected'); const h = r.on('value', s => { if (s.val()) { clearTimeout(t); r.off('value', h); res(); } }); });
    // 上次當房主留下的房間已經不能繼續，順手清掉
    const saved = loadRoom();
    if (saved && saved.role === 'host') {
      saveRoom(null);
      const m = (await NET.db.ref(`rooms/${saved.code}/meta`).once('value').catch(() => null));
      if (m && m.val() && m.val().host === NET.uid) { NET.db.ref(`rooms/${saved.code}`).remove().catch(() => {}); NET.db.ref(`lobby/${saved.code}`).remove().catch(() => {}); }
    }
    flushStats();
  })();
  fbReady.catch(() => { fbReady = null; });
  return fbReady;
}
// 連線恢復時重新報到（斷線時資料庫會自動把「在線」拿掉）
function onReconnect() {
  if (!NET.code) return;
  const on = NET.ref(`online/${NET.uid}`);
  on.set(true); on.onDisconnect().remove();
  if (NET.role === 'host' && NET.open && !NET.started) { const L = NET.db.ref(`lobby/${NET.code}`); L.set({ open: true, t: firebase.database.ServerValue.TIMESTAMP }); L.onDisconnect().remove(); }
}

// 測試模式（網址加 ?test=1）每個分頁各自記錄，正式使用時記在這台裝置上
const TEST = /[?&]test=1/.test(location.search);
const store = () => TEST ? sessionStorage : localStorage;
function saveRoom(r) { try { r ? store().setItem('mj_room', JSON.stringify(r)) : store().removeItem('mj_room'); } catch (e) {} }
function loadRoom() { try { return JSON.parse(store().getItem('mj_room') || 'null'); } catch (e) { return null; } }
function getNick() { try { return store().getItem('mj_nick') || localStorage.getItem('mj_nick') || ''; } catch (e) { return ''; } }
function setNick(n) { try { store().setItem('mj_nick', n); } catch (e) {} }

/* ================= 帳號與戰績 =================
   用 Firebase 的「電子郵件＋密碼」登入，信箱要點過驗證信才算數（一個信箱只能註冊一個帳號）。
   戰績存在 users/自己的uid，只有自己讀寫得到。沒網路時先存在這台，連上後再送出。 */
const ACC = { uid: null, name: null, unverified: null };   // unverified：已登入但信箱還沒驗證

  const was = ACC.uid + '|' + ACC.unverified;

function markRecorded(key) {
  key = ACC.uid + '|' + key;
  let list = [];
  try { list = JSON.parse(store().getItem('mj_rec') || '[]'); } catch (e) {}
  if (list.includes(key)) return false;

function loadQueue() { try { return JSON.parse(store().getItem('mj_statq') || '[]'); } catch (e) { return []; } }
function saveQueue(q) { try { store().setItem('mj_statq', JSON.stringify(q)); } catch (e) {} }
function enqueueStat(item) {
  const q = loadQueue(); q.push({ id: randHex(6), uid: ACC.uid, ...item }); saveQueue(q);
  flushStats();
}
let flushing = false;
async function flushStats() {
  if (flushing || !loadQueue().length) return;
  flushing = true;
  try {
    await connect();
    for (const it of loadQueue()) {
      if (it.uid !== ACC.uid) continue;          // 別的帳號留下的，等那個帳號登入再送
      const inc = firebase.database.ServerValue.increment, base = `users/${it.uid}/stats/${it.mode}/`, u = {};
      for (const [k, v] of Object.entries(it.s)) if (v) u[base + k] = inc(v);
      u[base + 'last'] = it.t;
      if (it.hist) u[`users/${it.uid}/history/${it.t}_${it.id}`] = it.hist;
      if (ACC.name) u[`users/${it.uid}/profile/name`] = ACC.name;
      await NET.db.ref().update(u);
      if (it.tai != null) await NET.db.ref(base + 'maxTai').transaction(cur => (cur || 0) >= it.tai ? undefined : it.tai);
      saveQueue(loadQueue().filter(x => x.id !== it.id));
    }
    if (loadQueue().some(x => x.uid === ACC.uid)) setTimeout(flushStats, 0);   // 送出期間又打完的局
  } catch (e) { console.warn('戰績暫時送不出去，下次連線再送', e); }
  finally { flushing = false; }
}
function recordRound(R, me, mode, key) {
  if (!ACC.uid || !R || me < 0 || !markRecorded(key)) return;
  const s = { rounds: 1 }; let tai = null;
  if (R.draw) s.draws = 1;
  else {
    s.net = R.pays[me];
    if (R.p === me) { tai = R.total + R.dealerTai; s.wins = 1; s.taiSum = tai; if (R.selfDraw) s.selfDraws = 1; }
    else if (R.from === me) s.dealIns = 1;
    else if (R.selfDraw) s.paidSelfDraw = 1;
  }
  enqueueStat({ mode, s, tai, t: Date.now() });
}
function recordMatch(O, me, mode, key, rounds) {
  if (!ACC.uid || !O || me < 0 || !markRecorded(key)) return;
  const rank = O.rank.indexOf(me) + 1, t = Date.now();
  enqueueStat({ mode, s: { matches: 1, firsts: rank === 1 ? 1 : 0 }, t,
    hist: { t, mode, rank, score: O.scores[me], rounds: rounds || 0, reason: String(O.reason || '').slice(0, 20) } });
}

  if (/too-many-requests/.test(c)) return '嘗試太多次了，請等幾分鐘再試。';

    e.preventDefault();
    const mail = $('acMail').value.trim(), msg = $('acMsg');

    if (!EMAIL_RE.test(mail)) { msg.textContent = '請輸入正確的電子信箱。'; return; }

    if (!reset) {
      pw = $('acPw').value;
      if (pw.length < 6) { msg.textContent = '密碼至少要 6 個字。'; return; }
    }
    if (reg) {
      name = $('acName').value.trim();
      if (!NAME_RE.test(name)) { msg.textContent = '暱稱要 2–8 個字，只能用中英文、數字或底線。'; return; }
      if (pw !== $('acPw2').value) { msg.textContent = '兩次輸入的密碼不一樣。'; return; }
    }
    msg.textContent = '連線中…'; busy(true);
    try {
      await connect();
      const auth = firebase.auth();
      if (reset) {
        await auth.sendPasswordResetEmail(mail);
        msg.className = 'lbmsg ok';
        msg.textContent = '如果這個信箱有註冊過，重設密碼的信已經寄出了。照信裡的連結設定新密碼，再回來登入。';
        busy(false); return;
      }
      let user;
      if (reg) {
        user = (await auth.createUserWithEmailAndPassword(mail, pw)).user;
        await user.updateProfile({ displayName: name });
        setNick(name);
        await user.sendEmailVerification().catch(err => console.warn(err));
      } else user = (await auth.signInWithEmailAndPassword(mail, pw)).user;
      await afterAuth(user);
      if (ACC.unverified != null) verifyModal(reg ? '' : '這個信箱還沒驗證。');
      else showLobby();
    } catch (err) {
      console.warn(err);
      if ($('acMsg')) { $('acMsg').textContent = authMsg(err); busy(false); }
    }
  };
  $('acMail').focus();
}

async function checkVerified(showMiss) {
  const user = window.firebase && firebase.auth().currentUser;
  if (!user || user.isAnonymous) return;
  if ($('vfMsg')) { busy(true); $('vfMsg').className = 'lbmsg'; $('vfMsg').textContent = '確認中…'; }
  try {
    await user.reload();
    if (user.emailVerified) {
      await user.getIdToken(true);                 // 換一張新的登入憑證，資料庫才知道已驗證
      await afterAuth(user);
      showLobby();
      return;
    }
    if (showMiss && $('vfMsg')) $('vfMsg').textContent = '還沒收到驗證。請先點信裡的連結，再按一次。';
  } catch (e) { console.warn(e); if ($('vfMsg')) $('vfMsg').textContent = authMsg(e); }
  if ($('vfMsg')) { busy(false); if (!showMiss) $('vfMsg').textContent = ''; }
}

const fmtNet = n => `<span class="${n > 0 ? 'pos' : n < 0 ? 'neg' : ''}">${n > 0 ? '+' : ''}${(+n || 0).toLocaleString()}</span>`;
async function showStats() {
  modal(`<h2>我的戰績</h2><p class="muted">讀取中…</p>`);

    const [a, b] = await Promise.all([
      NET.db.ref(`users/${ACC.uid}/stats`).once('value'),
      NET.db.ref(`users/${ACC.uid}/history`).orderByKey().limitToLast(20).once('value')
    ]);

  } catch (e) {
    console.warn(e);

  }

    if (it.uid !== ACC.uid) continue;

    for (const [k, v] of Object.entries(it.s)) m[k] = (m[k] || 0) + (v || 0);
    if (it.tai != null) m.maxTai = Math.max(m.maxTai || 0, it.tai);

  const all = {}; for (const k of keys) all[k] = (solo[k] || 0) + (onl[k] || 0);
  all.maxTai = Math.max(solo.maxTai || 0, onl.maxTai || 0);
  const row = (label, f) => `<tr><td>${label}</td>${[all, solo, onl].map(x => `<td class="num">${f(x)}</td>`).join('')}</tr>`;

    <div class="kpis">
      <div class="kpi"><b>${n(all.rounds)}</b><span>總局數</span></div>
      <div class="kpi"><b>${n(all.wins)}</b><span>胡牌（${pct(all.wins, all.rounds)}）</span></div>
      <div class="kpi"><b>${n(all.selfDraws)}</b><span>自摸</span></div>
      <div class="kpi"><b>${n(all.dealIns)}</b><span>放槍（${pct(all.dealIns, all.rounds)}）</span></div>
      <div class="kpi"><b>${fmtNet(all.net)}</b><span>累計輸贏</span></div>
    </div>
    <h3>明細</h3>
    <table><tr><th></th><th class="num">全部</th><th class="num">單人</th><th class="num">連線</th></tr>
      ${row('總局數', x => n(x.rounds))}
      ${row('胡牌', x => `${n(x.wins)} <small class="muted">${pct(x.wins, x.rounds)}</small>`)}
      ${row('　其中自摸', x => n(x.selfDraws))}
      ${row('放槍', x => `${n(x.dealIns)} <small class="muted">${pct(x.dealIns, x.rounds)}</small>`)}
      ${row('被自摸', x => n(x.paidSelfDraw))}
      ${row('流局', x => n(x.draws))}
      ${row('胡牌平均台數', x => x.wins ? (x.taiSum / x.wins).toFixed(1) : '—')}
      ${row('最大一把', x => x.maxTai ? x.maxTai + ' 台' : '—')}

async function createRoom(nick, open) {
  let code = null;
  for (let i = 0; i < 8 && !code; i++) {
    const c = String(10000 + randInt(90000));
    const r = await NET.db.ref(`rooms/${c}/meta`).transaction(cur => cur ? undefined : { host: NET.uid, status: 'waiting', open: !!open, t: Date.now() });
    if (r.committed) code = c;
  }
  if (!code) throw new Error('開房失敗，請再試一次');
  Object.assign(NET, { code, role: 'host', seat: 0, open: !!open, status: 'waiting', hostUid: NET.uid, started: false });
  await NET.ref('seats/0').set({ uid: NET.uid, name: nick });
  onReconnect();
  saveRoom({ code, role: 'host' });
  NET.watch(`rooms/${code}/seats`, s => {
    NET.seatsVal = s.val() || {};
    if (NET.started) return;
    drawWaiting();
    if (seatList().every(Boolean)) startOnline();      // 湊滿四人就開始
  });
  NET.watch(`rooms/${code}/online`, s => {
    NET.online = s.val() || {};
    if (!NET.started) { drawWaiting(); return; }
    for (const pr of prompts.values()) if (G.seats[pr.p].type === 'remote' && !NET.online[G.seats[pr.p].uid]) pr.timers.push(setTimeout(pr.ai, 1500));
    render();
  });
}
async function joinRoom(nick, code) {
  if (!/^\d{5}$/.test(code)) throw new Error('房號是 5 位數字');
  const meta = (await NET.db.ref(`rooms/${code}/meta`).once('value')).val();
  if (!meta) throw new Error('找不到這個房間');
  const seatsVal = (await NET.db.ref(`rooms/${code}/seats`).once('value')).val() || {};
  let seat = -1;
  for (const [i, s] of Object.entries(seatsVal)) if (s && s.uid === NET.uid) seat = +i;
  if (seat < 0) {
    if (meta.status !== 'waiting') throw new Error('這個房間已經開始了');
    for (let i = 1; i < 4 && seat < 0; i++) {
      const r = await NET.db.ref(`rooms/${code}/seats/${i}`).transaction(cur => cur ? undefined : { uid: NET.uid, name: nick });
      if (r.committed) seat = i;
    }
  }
  if (seat < 0) throw new Error('房間已經滿了');
  Object.assign(NET, { code, role: 'client', seat, open: !!meta.open, status: meta.status, hostUid: meta.host });
  const seatRef = NET.ref(`seats/${seat}`);
  if (meta.status === 'waiting') seatRef.onDisconnect().remove();   // 開局前離線就讓出位子
  onReconnect();
  saveRoom({ code, role: 'client' });
  NET.watch(`rooms/${code}/meta`, s => {
    const m = s.val();
    if (!m) { if (NET.role === 'client') { NET.leave(); showLobby('房主已經離開，牌局結束了。'); } return; }
    NET.status = m.status; NET.open = !!m.open; NET.hostUid = m.host;
    if (m.status === 'playing') seatRef.onDisconnect().cancel();
    if (m.status === 'waiting') drawWaiting();
  });
  NET.watch(`rooms/${code}/seats`, s => { NET.seatsVal = s.val() || {}; if (NET.status === 'waiting') drawWaiting(); });
  NET.watch(`rooms/${code}/online`, s => {
    NET.online = s.val() || {};
    const away = NET.status === 'playing' && !NET.online[NET.hostUid];
    if (away !== NET.hostAway) {
      NET.hostAway = away; clearTimeout(NET.awayT);
      if (away) NET.awayT = setTimeout(hostGoneDialog, 30000);
      if (lastD) draw(lastD);
    }
    if (NET.status === 'waiting') drawWaiting();
  });
  NET.watch(`rooms/${code}/view/${NET.uid}`, s => {
    const j = s.val(); if (!j) return;
    let D; try { D = JSON.parse(j); } catch (e) { return; }
    clientDraw(D);
  });
}
async function quickMatch(nick) {
  const snap = await NET.db.ref('lobby').orderByChild('open').equalTo(true).limitToFirst(20).once('value');
  const codes = Object.keys(snap.val() || {});
  for (const code of codes) {
    try { await joinRoom(nick, code); return; }
    catch (e) { NET.unwatchAll(); NET.db.ref(`rooms/${code}/meta`).once('value').then(m => { if (!m.exists()) NET.db.ref(`lobby/${code}`).remove(); }).catch(() => {}); }
  }
  await createRoom(nick, true);
}
const seatList = () => [0, 1, 2, 3].map(i => NET.seatsVal[i] || null);

function drawWaiting() {
  if (!NET.code || NET.started || NET.status === 'playing') return;
  const seats = seatList(), n = seats.filter(Boolean).length, host = NET.role === 'host';
  NET.modalKind = 'waiting';
  modal(`<h2>${NET.open ? '自動配對中…' : '房間已開好'}</h2>
    ${NET.open ? `<p>正在幫你找其他玩家（${n}/4）。湊滿四人會自動開始。</p>`
      : `<p>房號</p><p class="code">${esc(NET.code)}</p><p>把房號傳給朋友，在大廳的「輸入房號」加入。</p>`}
    <ul class="seatlist">${seats.map(s => `<li>${s ? esc(s.name) + (s.uid === NET.uid ? '（你）' : '') + (NET.online[s.uid] ? '' : ' <small>離線</small>') : '<span class="muted">等待加入…</span>'}</li>`).join('')}</ul>
    <p class="muted">${host ? '按開始後，空位由電腦代打。' : '等待房主開始遊戲…'}</p>
    <div class="btns"><button class="btn alt" id="wrLeave">離開</button>${host ? `<button class="btn" id="wrStart">${NET.open && n < 4 ? '不等了，電腦補位開始' : '開始遊戲'}</button>` : ''}</div>`);
  $('wrLeave').onclick = () => { NET.leave(); showLobby(); };
  if (host) $('wrStart').onclick = startOnline;
}
async function startOnline() {
  if (NET.started) return;
  NET.started = true; NET.status = 'playing';
  NET.ref('meta/status').set('playing');
  NET.db.ref(`lobby/${NET.code}`).remove();
  G.mode = 'host';
  G.seats = seatList().map(s => !s ? { type: 'ai' } : s.uid === NET.uid ? { type: 'local', name: s.name, uid: s.uid } : { type: 'remote', name: s.name, uid: s.uid });
  G.seats.forEach((s, p) => {
    if (s.type !== 'remote') return;
    NET.watch(`rooms/${NET.code}/act/${s.uid}`, snap => {
      const v = snap.val(); if (!v) return;
      const pr = prompts.get(p); if (!pr || pr.seq !== v.seq) return;
      let a = null; try { a = JSON.parse(v.a); } catch (e) {}
      pr.res(validAct(p, pr.kind, pr.data, a) ? a : aiDecide(p, pr.kind, pr.data));
    });
  });
  NET.modalKind = null;
  setMode(); keepAwake();
  newGame();
}
// 連線玩家：收到房主送來的畫面資料
function clientDraw(D) {
  if (D.lastFair) NET.lastFair = D.lastFair;
  if (NET.modalKind === 'waiting' || NET.modalKind === 'lobby') { closeModal(); NET.modalKind = null; keepAwake(); }
  draw(D);
  if (D.gid) {
    if (D.result) recordRound(D.result, D.me, 'online', `${D.room}|${D.gid}|${D.round}`);
    if (D.over) recordMatch(D.over, D.me, 'online', `${D.room}|${D.gid}|over`, D.round);
  }
  if (D.over) {
    const key = JSON.stringify(D.over);
    if (NET.shownOver !== key) {
      NET.shownOver = key; NET.modalKind = 'over';
      waitModal(gameOverHTML(D.over, D) + '<p class="muted">等待房主決定要不要再來一將…</p>', [{ label: '離開房間', v: 1, alt: true }])
        .then(() => { NET.leave(); showLobby(); });
    }
  } else if (D.result && D.prompt && D.prompt.kind === 'next') {
    if (NET.shownNext !== D.prompt.seq) {
      NET.shownNext = D.prompt.seq; NET.modalKind = 'result';
      waitModal(resultHTML(D.result, D), [{ label: '下一局', v: 1 }], resultTitle(D.result, D)).then(() => {
        respond({ type: 'next' });
        if (NET.modalKind === 'result') { NET.modalKind = 'result-wait'; modal(`<h2>等待其他玩家…</h2><p>大家都按「下一局」後就會開始。</p>`); }
      });
    }
  } else if (!D.result && (NET.modalKind === 'result' || NET.modalKind === 'result-wait' || NET.modalKind === 'over')) {
    closeModal(); NET.modalKind = null; NET.shownOver = null;
  }
  // 托管：由這台的電腦幫忙決定
  if (G.auto && D.prompt && D.prompt.kind !== 'next' && NET.autoSeq !== D.prompt.seq) {
    NET.autoSeq = D.prompt.seq;
    const pr = D.prompt;
    setTimeout(() => {
      if (!lastD || !lastD.prompt || lastD.prompt.seq !== pr.seq) return;
      respond(pr.kind === 'turn' ? AI.turn(D.v, pr.data) : AI.claim(D.v, pr.data.tile, pr.data.opts));
    }, 400);
  }
}

function showLobby(msg) {
  const saved = loadRoom();
  const rejoin = saved && saved.role === 'client' && !NET.role;
  modal(`<h2>🀄 台灣十六張麻將</h2>
    ${msg ? `<p class="bad">${esc(msg)}</p>` : ''}
    <div class="lobby">
      <div class="acct" id="lbAcct"></div>
      <label class="fld" for="nick">你的暱稱（連線時其他人看到的名字）</label>
      <input id="nick" maxlength="8" autocomplete="off" value="${esc(getNick())}" placeholder="最多 8 個字">
      ${rejoin ? `<button class="btn big" id="lbRejoin">回到房間 ${esc(saved.code)}<small>剛才離開的連線牌局</small></button>` : ''}
      <button class="btn big" id="lbSolo">單人遊戲<small>對三家電腦，不用網路</small></button>
      <button class="btn big" id="lbQuick">自動配對<small>和線上玩家湊滿四人，人不夠可以電腦補位</small></button>
      <button class="btn big" id="lbHost">開房間<small>拿到房號傳給朋友</small></button>
      <div class="joinrow"><input id="code" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="輸入 5 位數房號"><button class="btn" id="lbJoin">加入</button></div>
      <p class="lbmsg" id="lbMsg" role="status"></p>
    </div>
    <details><summary>規則說明</summary>${RULES.replace('<h2>規則說明</h2>', '')}</details>`);
  NET.modalKind = 'lobby';
  drawAcct();
  const go = fn => async () => {
    const nick = ($('nick').value || '').trim().slice(0, 8);
    if (!nick) { $('lbMsg').textContent = '請先輸入暱稱。'; $('nick').focus(); return; }
    setNick(nick);
    $('lbMsg').textContent = '連線中…';
    $('modalCard').querySelectorAll('button').forEach(b => b.disabled = true);
    try { await connect(); await fn(nick); }
    catch (e) {
      console.error(e);
      NET.leave();
      if ($('lbMsg')) {
        $('lbMsg').textContent = e && /[一-鿿]/.test(e.message || '') ? e.message : '連線失敗，請確認網路後再試一次。';
        $('modalCard').querySelectorAll('button').forEach(b => b.disabled = false);
      }
    }
  };
  $('lbSolo').onclick = () => startSolo();
  $('lbQuick').onclick = go(nick => quickMatch(nick));
  $('lbHost').onclick = go(nick => createRoom(nick, false));
  $('lbJoin').onclick = go(nick => joinRoom(nick, ($('code').value || '').trim()));
  $('code').onkeydown = e => { if (e.key === 'Enter') $('lbJoin').click(); };
  if (rejoin) $('lbRejoin').onclick = go(nick => joinRoom(nick, saved.code));
}

$('btnRules').onclick = () => { modal(RULES + `<div class="btns"><button class="btn" id="mclose">關閉</button></div>`); $('mclose').onclick = closeModal; };
$('btnNew').onclick = () => {
  if (NET.role) {
    modal(`<h2>離開牌局？</h2><p>${NET.role === 'host' ? '你是房主，離開後這場牌局會結束，其他人也會回到大廳。' : '離開後可以在大廳按「回到房間」接著打。'}</p>
      <div class="btns"><button class="btn alt" id="mclose">取消</button><button class="btn" id="mok">離開</button></div>`);
    $('mclose').onclick = closeModal;
    $('mok').onclick = () => { const keep = NET.role === 'client' && NET.status === 'playing' ? { code: NET.code, role: 'client' } : null; NET.leave(); saveRoom(keep); showLobby(); };
    return;
  }
  if (!S) return showLobby();
  // 用自己的視窗代替 confirm()，iPad 主畫面模式與內嵌頁面都能用
  modal(`<h2>重新開始？</h2><p>目前分數會歸零。</p><div class="btns"><button class="btn alt" id="mlobby">回大廳</button><button class="btn alt" id="mclose">取消</button><button class="btn" id="mok">重新開始</button></div>`);
  $('mclose').onclick = closeModal; $('mok').onclick = newGame; $('mlobby').onclick = () => { stopGame(); S = null; clearTable(); showLobby(); };
};
$('optHint').onchange = e => { G.hint = e.target.checked; if (NET.role === 'client') { if (lastD) draw(lastD); } else render(); };
$('optAuto').onchange = e => {
  G.auto = e.target.checked;
  if (NET.role === 'client') { NET.autoSeq = null; if (lastD) clientDraw(lastD); }
  else { if (G.auto) autoResolve(); render(); }
};
$('optSpeed').onchange = e => { G.speed = +e.target.value; };
// 手機橫拿時的右上角選單
function setMenu(open) { document.body.classList.toggle('menu-open', open); $('btnMenu').setAttribute('aria-expanded', open); }
$('btnMenu').onclick = e => { e.stopPropagation(); setMenu(!document.body.classList.contains('menu-open')); };
document.addEventListener('click', e => {
  if (!document.body.classList.contains('menu-open')) return;
  if (!e.target.closest('.bar') || e.target.closest('button')) setMenu(false);
});
$('btnUpdate').onclick = () => {
  modal(`<h2>更新到新版本？</h2><p>${S || NET.role ? '目前這場牌局會結束。' : ''}更新只要幾秒鐘。</p><div class="btns"><button class="btn alt" id="mclose">等一下</button><button class="btn" id="mok">更新</button></div>`);
  $('mclose').onclick = closeModal; $('mok').onclick = () => { NET.leave(); location.reload(); };
};

// 開始畫面：大廳。上次有登入帳號就在背景連線，恢復登入並送出還沒送的戰績
showLobby();
if (savedAcct() || loadQueue().length) connect().then(() => { if (NET.modalKind === 'lobby') drawAcct(); }).catch(() => {});

// 放在網站上時註冊離線快取（直接開檔案時不會執行）
// 自動更新：打開或切回 App 時檢查新版；在大廳就直接換新版，打牌中則顯示「有新版本」按鈕
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;                       // 第一次安裝不用重新載入
    if (!S && !NET.role) location.reload();
    else { $('btnUpdate').hidden = false; $('btnMenu').classList.add('dot'); }
  });
}

// 測試用：只暴露分析函式（不含任何遊戲狀態）
window.__mjTest = { sha256, shantenC, canWin, counts, allDecomps, waitsOf, tileHTML };
})();
</script>
</body>
</html>
