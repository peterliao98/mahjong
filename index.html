/* ---------- 連線玩家離線：暫停、大家投票、電腦接手（房主那台負責） ----------
   離線超過 OFF_GRACE 才算數（手機切換網路常會短暫斷線）。打牌中就立刻暫停；
   結算畫面時先等到下一局開始。所有在線的真人都按「繼續」才繼續，有人按「結束」整場就結束。
   離線的人在大家決定前回來，就照常繼續。VOTE_MS 內沒回應的人視為繼續。 */
const OFF_GRACE = 5000, VOTE_MS = 60000;
const offTimers = {};
function pauseVoters() {
  return [0, 1, 2, 3].filter(p => G.seats[p].type === 'local' ||
    (G.seats[p].type === 'remote' && NET.online[G.seats[p].uid] && !G.offSeats.has(p)));
}
function watchOffline() {
  if (G.mode !== 'host') return;
  G.seats.forEach((s, p) => {
    if (s.type !== 'remote') return;
    if (!NET.online[s.uid]) {
      if (!offTimers[p] && !G.offSeats.has(p)) offTimers[p] = setTimeout(() => {
        offTimers[p] = 0;
        if (G.seats[p].type === 'remote' && !NET.online[G.seats[p].uid]) markOffline(p);
      }, OFF_GRACE);
    } else {
      clearTimeout(offTimers[p]); offTimers[p] = 0;
      if (G.offSeats.has(p)) { G.offSeats.delete(p); addLog(`${s.name} 回來了`); }
    }
  });
  checkPause();
}
function markOffline(p) {
  G.offSeats.add(p);
  addLog(`${G.seats[p].name} 離線了`);
  if (G.pauseInfo) { checkPause(); render(); }
  else if (S && !G.result && !G.over) beginPause();       // 結算中就等下一局開始時（pauseGate）再問
}
async function pauseGate() {
  if (G.mode === 'host' && G.offSeats.size && !G.pauseInfo && !G.result && !G.over) beginPause();
  while (G.pause) await G.pause;
}
function beginPause() {
  G.pauseInfo = { id: 'P' + (++G.seq), votes: {}, deadline: NET.now() + VOTE_MS };
  G.pause = new Promise(r => { G.pauseRes = r; });
  // 所有正在等的決定先停止倒數
  for (const pr of prompts.values()) { pr.timers.forEach(clearTimeout); pr.timers = []; pr.frozen = true; pr.deadline = 0; }
  G.pauseInfo.timer = setTimeout(() => finishPause(true), VOTE_MS);
  render();
}
function checkPause() {
  if (!G.pauseInfo) return;
  if (!G.offSeats.size) return finishPause(false);            // 離線的人都回來了
  if (pauseVoters().every(q => G.pauseInfo.votes[q])) finishPause(true);
}
function onPauseVote(p, choice) {
  if (!G.pauseInfo) return;
  if (choice === 'end') return endByVote(p);
  G.pauseInfo.votes[p] = true;
  checkPause(); render();
}
function finishPause(takeOver) {
  if (!G.pauseInfo) return;
  clearTimeout(G.pauseInfo.timer);
  if (takeOver) for (const p of G.offSeats) {
    const s = G.seats[p];
    addLog(`${s.name} 改由電腦接手`);
    G.seats[p] = { type: 'ai' };                                 // 名字會顯示成「電腦·上家」這類
    NET.ref(`seats/${p}/ai`).set(true).catch(e => console.warn(e));
    NET.ref(`view/${s.uid}`).set(JSON.stringify({ kicked: true })).catch(e => console.warn(e));
    delete NET.lastSent[p];
  }
  G.offSeats.clear();
  G.pauseInfo = null;
  const res = G.pauseRes; G.pause = null; G.pauseRes = null;
  // 恢復倒數；已經交給電腦的座位直接由電腦決定
  for (const pr of [...prompts.values()]) {
    if (!pr.frozen) continue;
    pr.frozen = false;
    if (G.seats[pr.p].type === 'ai') { pr.ai(); continue; }
    const timeout = G.mode === 'host' ? (pr.kind === 'next' ? NEXT_MS : TURN_MS) : 0;
    pr.deadline = timeout ? NET.now() + timeout : 0;
    startPromptTimers(pr, timeout);
  }
  if (res) res();
  render();
}
function endByVote(p) {
  const msg = `${p === localSeat() ? '房主' : G.seats[p].name} 選擇結束牌局。`;
  if (G.pauseInfo) clearTimeout(G.pauseInfo.timer);
  const res = G.pauseRes;
  Object.assign(G, { pauseInfo: null, pause: null, pauseRes: null }); G.offSeats.clear();
  NET.ref('meta/ended').set(msg).catch(() => {}).finally(() => { NET.leave(); showLobby(msg); });
  if (res) res();
}
// 暫停詢問的視窗（房主與連線玩家共用）
let pauseKey = null;
function pauseVote(choice, id) {
  if (NET.role === 'client') NET.ref(`act/${NET.uid}`).set({ seq: id, a: JSON.stringify({ type: choice }) }).catch(e => console.warn(e));
  else onPauseVote(localSeat(), choice);
}
function drawPause(D) {
  const P = D.pause;
  if (!P) { if (NET.modalKind === 'pause') { closeModal(); NET.modalKind = null; } pauseKey = null; return; }
  const voter = P.voters.includes(D.me), voted = !!P.votes[D.me];
  const waiting = P.voters.filter(q => !P.votes[q]).map(q => dispName(D, q));
  const names = P.off.map(q => dispName(D, q)).join('、');
  const key = [P.id, voted, waiting.join(','), names].join('|');
  if (key === pauseKey) return;
  pauseKey = key; NET.modalKind = 'pause';
  modal(`<h2>⚠️ ${esc(names)} 離線了</h2>
    <p>牌局先暫停。<b>所有人都按「繼續牌局」才會繼續</b>，${esc(names)} 的位子改由電腦接手（名字會變成「電腦」），之後就不能再回到這場牌局。</p>
    ${voter && !voted ? `<div class="btns"><button class="btn alt" id="pzEnd">結束牌局</button><button class="btn" id="pzGo">繼續牌局</button></div>`
      : `<p>${voted ? '你已經選擇繼續。' : ''}等待 ${esc(waiting.join('、') || '其他玩家')} 確認…</p>`}
    <p class="muted">${esc(names)} 如果在大家決定前回來，就照常繼續。<span class="cd" data-dl="${+P.deadline}"></span>內沒有回應的人，視為同意繼續。</p>`);
  tickCountdown();
  if (voter && !voted) { $('pzGo').onclick = () => pauseVote('cont', P.id); $('pzEnd').onclick = () => pauseVote('end', P.id); }
}
// 連線玩家：收到房主送來的畫面資料
function clientDraw(D) {
  if (D.kicked) { NET.leave(); showLobby('你離線的時候，大家決定繼續牌局，你的位子已經由電腦接手了。'); return; }
  if (D.lastFair) NET.lastFair = D.lastFair;
  if (NET.modalKind === 'waiting' || NET.modalKind === 'lobby') { closeModal(); NET.modalKind = null; keepAwake(); }
  draw(D);
  if (D.gid) {
    if (D.result) recordRound(D.result, D.me, 'online', `${D.room}|${D.gid}|${D.round}`);
    if (D.over) recordMatch(D.over, D.me, 'online', `${D.room}|${D.gid}|over`, D.round);
  }
  if (D.over) {
    const key = JSON.stringify(D.over);
    if (NET.shownOver !== key) {
      NET.shownOver = key; NET.modalKind = 'over';
      waitModal(gameOverHTML(D.over, D) + '<p class="muted">等待房主決定要不要再來一將…</p>', [{ label: '離開房間', v: 1, alt: true }])
        .then(() => { NET.leave(); showLobby(); });
    }
  } else if (D.result && D.prompt && D.prompt.kind === 'next') {
    if (NET.shownNext !== D.prompt.seq) {
      NET.shownNext = D.prompt.seq; NET.modalKind = 'result';
      waitModal(resultHTML(D.result, D), [{ label: '下一局', v: 1 }], resultTitle(D.result, D)).then(() => {
        respond({ type: 'next' });
        if (NET.modalKind === 'result') { NET.modalKind = 'result-wait'; modal(`<h2>等待其他玩家…</h2><p>大家都按「下一局」後就會開始。</p>`); }
      });
    }
  } else if (!D.result && (NET.modalKind === 'result' || NET.modalKind === 'result-wait' || NET.modalKind === 'over')) {
    closeModal(); NET.modalKind = null; NET.shownOver = null;
  }
  // 托管：由這台的電腦幫忙決定
  if (G.auto && D.prompt && D.prompt.kind !== 'next' && NET.autoSeq !== D.prompt.seq) {
    NET.autoSeq = D.prompt.seq;
    const pr = D.prompt;
    setTimeout(() => {
      if (!lastD || !lastD.prompt || lastD.prompt.seq !== pr.seq) return;
      respond(pr.kind === 'turn' ? AI.turn(D.v, pr.data) : AI.claim(D.v, pr.data.tile, pr.data.opts));
    }, 400);
  }
}

// 右上角選單
function setMenu(open) { document.body.classList.toggle('menu-open', open); $('btnMenu').setAttribute('aria-expanded', open); }
$('btnMenu').onclick = e => { e.stopPropagation(); setMenu(!document.body.classList.contains('menu-open')); };
document.addEventListener('click', e => {
  if (!document.body.classList.contains('menu-open')) return;
  if (!e.target.closest('.bar') || e.target.closest('button')) setMenu(false);
});
$('btnUpdate').onclick = () => {
  modal(`<h2>更新到新版本？</h2><p>${S || NET.role ? '目前這場牌局會結束。' : ''}更新只要幾秒鐘。</p><div class="btns"><button class="btn alt" id="mclose">等一下</button><button class="btn" id="mok">更新</button></div>`);
  $('mclose').onclick = closeModal; $('mok').onclick = () => { NET.leave(); location.reload(); };
};

// 版本號：從 sw.js 讀（只要改 sw.js 一個地方），顯示在大廳下方與選單
let APP_VER = '';
function showVersion() {
  if ($('verBar')) $('verBar').textContent = APP_VER;
  if ($('lbVer')) $('lbVer').textContent = APP_VER ? '版本 ' + APP_VER : '';
}
fetch('sw.js', { cache: 'no-cache' }).then(r => r.text()).then(t => {
  const m = t.match(/mahjong16-(v\d+)/); if (m) { APP_VER = m[1]; showVersion(); }
}).catch(() => {});

// 開始畫面：大廳。上次有登入帳號就在背景連線，恢復登入並送出還沒送的戰績
showLobby();
if (savedAcct() || loadQueue().length) connect().then(() => { if (NET.modalKind === 'lobby') drawAcct(); }).catch(() => {});

// 放在網站上時註冊離線快取（直接開檔案時不會執行）
// 自動更新：打開或切回 App 時檢查新版；在大廳就直接換新版，打牌中則顯示「有新版本」按鈕
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;                       // 第一次安裝不用重新載入
    if (!S && !NET.role) location.reload();
    else { $('btnUpdate').hidden = false; $('btnMenu').classList.add('dot'); }
  });
}

// 測試用：只暴露分析函式（不含任何遊戲狀態）
window.__mjTest = { sha256, shantenC, canWin, counts, allDecomps, waitsOf, tileHTML };
})();
</script>
</body>
